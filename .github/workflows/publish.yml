name: Publish to npm

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - run: npm install


            # Node 22 bundles npm 10.x, which cannot do Trusted Publishing: it
            # sends no credential, and npm reports the failed auth as a 404 on
            # the package. The range enforces the floor the feature requires
            # rather than trusting whatever @latest happens to be.
            - name: Upgrade npm to a Trusted-Publishing-capable version
              run: |
                  npm install -g "npm@>=11.5.1"
                  npm --version
            - run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
